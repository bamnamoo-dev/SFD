        const IconSave = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconPrinter = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
        const IconMinusCircle = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>;
        const IconRotateCcw = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconUndo = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>;
        const IconRedo = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>;

        const formatDate = (val) => {
            if (!val) return '';
            if (typeof val === 'number') {
                const date = new Date(Math.round((val - 25569) * 86400 * 1000));
                return date.toISOString().split('T')[0];
            }
            if (typeof val === 'string') {
                if (val.includes('T')) return val.split('T')[0];
                if (/^\d{8}$/.test(val)) return `${val.substring(0,4)}-${val.substring(4,6)}-${val.substring(6,8)}`;
            }
            return String(val);
        };

        const formatCurrency = (val) => {
            const num = Number(val);
            if (isNaN(num)) return '0';
            return new Intl.NumberFormat('ko-KR').format(num);
        };

        const formatPercent = (val) => {
            if (val === undefined || val === null || val === '') return '0.0%';
            const num = Number(val);
            if (isNaN(num)) return '0.0%';
            return `${num.toFixed(1)}%`;
        };

        const TableRow = memo(({ row: r, activeCols, activeTab, onUpdateBudget }) => {
            return (
                <tr className={r._totalType ? `total-${r._totalType}` : ''}>
                    {activeCols.map(col => {
                        const val = r[col.key];
                        const numVal = Number(val);
                        const isNegative = (col.isNum || col.isRate) && numVal < 0;
                        const isEditableSupp = activeTab === 'supplement' && col.key === '추경' && !r._totalType;
                        const isEditableNote = activeTab === 'supplement' && col.key === '_note' && !r._totalType;
                        
                        const isSuppCol = col.key === '추경';
                        let specialClass = isSuppCol ? 'supp-cell' : '';
                        if (isSuppCol && numVal > 0) specialClass += ' supp-positive';
                        else if (isSuppCol && numVal < 0) specialClass += ' supp-negative';

                        return (
                            <td key={col.key} className={`${col.isNum ? 'num-cell' : col.isRate ? 'percent-cell' : 'center-cell'} ${isNegative && !isSuppCol ? 'negative-val' : ''} ${specialClass}`}>
                                {isEditableSupp ? (
                                    <input 
                                        type="text" 
                                        className={`edit-input ${specialClass}`}
                                        value={val || ''}
                                        placeholder="0"
                                        onChange={(e) => {
                                            const raw = e.target.value.replace(/[^0-9.-]/g, '');
                                            onUpdateBudget(r._id, '추경', raw);
                                        }}
                                        onFocus={(e) => e.target.select()}
                                    />
                                ) : isEditableNote ? (
                                    <input 
                                        type="text" 
                                        className="edit-input-note"
                                        value={val || ''}
                                        placeholder="추경 사유 입력..."
                                        onChange={(e) => onUpdateBudget(r._id, '_note', e.target.value)}
                                    />
                                ) : (
                                    col.isNum ? formatCurrency(numVal) : 
                                    col.isRate ? formatPercent(val) : 
                                    (col.key === '_exclude' ? (r._exclude || r['정산재원'] || '') : 
                                    (col.key === '_costItem' ? (r._costItem || r['원가통계비목'] || '') : 
                                    (col.key === '_note' ? (r._note || '') : r[col.key] || '')))
                                )}
                            </td>
                        );
                    })}
                </tr>
            );
        });

        function App() {
            const [budgetData, setBudgetData] = useState(() => {
                try {
                    const saved = localStorage.getItem('sfd_budget_data');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [expenseData, setExpenseData] = useState(() => {
                try {
                    const saved = localStorage.getItem('sfd_expense_data');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [history, setHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);

            const [activeTab, setActiveTab] = useState('detail');
            const [search, setSearch] = useState('');
            const [isPending, startTransition] = useTransition();
            const [deferredSearch, setDeferredSearch] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: '', direction: 'asc' });
            const [activeFilterCol, setActiveFilterCol] = useState(null);
            const [columnFilters, setColumnFilters] = useState({});
            const [showManager, setShowManager] = useState(false);
            const [isLightMode, setIsLightMode] = useState(true);
            const [dragOverBox, setDragOverBox] = useState(null);
            const [dateMode, setDateMode] = useState('month');

            const [hiddenCols, setHiddenCols] = useState({ 
                detail: { policy: true, unit: true, manager: true, supplement: true, note: true },
                supplement: { policy: true, unit: true, manager: true, rate: true },
                expense: {}
            });

            const [detailColWidths, setDetailColWidths] = useState({ 
                policy: 110, unit: 120, project: 150, item: 140, desc: 220, cost: 130, 
                a: 110, b: 110, ab: 140, c: 110, ac: 140, supplement: 110, note: 160,
                rate: 80, exclude: 90, manager: 120 
            });
            const [expenseColWidths, setExpenseColWidths] = useState({ 
                proj: 200, item: 200, category: 150, date: 120, title: 450, payee: 150, amount: 130 
            });

            const filterRef = useRef(null);
            const managerRef = useRef(null);

            // LocalStorage & API Auto-Save
            useEffect(() => {
                try { localStorage.setItem('sfd_budget_data', JSON.stringify(budgetData)); } catch (e) {}
            }, [budgetData]);

            useEffect(() => {
                try { localStorage.setItem('sfd_expense_data', JSON.stringify(expenseData)); } catch (e) {}
            }, [expenseData]);

            // Heartbeat
            useEffect(() => {
                const sendHeartbeat = () => { fetch('/api/heartbeat').catch(() => {}); };
                sendHeartbeat();
                const interval = setInterval(sendHeartbeat, 3000);
                return () => clearInterval(interval);
            }, []);

            // API Load on Startup
            useEffect(() => {
                fetch('/api/load')
                    .then(res => res.json())
                    .then(data => {
                        if (data.budgetData && data.budgetData.length > 0) setBudgetData(data.budgetData);
                        if (data.expenseData && data.expenseData.length > 0) setExpenseData(data.expenseData);
                    })
                    .catch(() => {});
            }, []);

            // Theme toggle
            useEffect(() => {
                if (isLightMode) document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
            }, [isLightMode]);

            // Undo / Redo Key listener
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        if (historyIndex > 0) {
                            setBudgetData(JSON.parse(JSON.stringify(history[historyIndex - 1])));
                            setHistoryIndex(historyIndex - 1);
                        }
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        if (historyIndex < history.length - 1) {
                            setBudgetData(JSON.parse(JSON.stringify(history[historyIndex + 1])));
                            setHistoryIndex(historyIndex + 1);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [history, historyIndex]);

            // Outside click to close filter/modal
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (filterRef.current && !filterRef.current.contains(event.target)) setActiveFilterCol(null);
                    if (managerRef.current && !managerRef.current.contains(event.target) && !event.target.closest('.manager-toggle')) setShowManager(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const pushHistory = (newData) => {
                setHistory(prev => {
                    const next = prev.slice(0, historyIndex + 1);
                    return [...next, JSON.parse(JSON.stringify(newData))];
                });
                setHistoryIndex(prev => prev + 1);
            };

            const updateBudgetValue = (id, key, val) => {
                setBudgetData(prev => {
                    const next = prev.map(r => r._id === id ? { ...r, [key]: val } : r);
                    pushHistory(next);
                    return next;
                });
            };

            const reduceAllBalance = () => {
                if (!budgetData.length) return;
                if (!confirm('남아있는 모든 원인행위잔액(A-B)을 추경 감액(-)으로 일괄 적용하시겠습니까?')) return;
                setBudgetData(prev => {
                    const next = prev.map(row => {
                        if (row._totalType) return row;
                        const balance = (row._a || 0) - (row._b || 0);
                        if (balance > 0) {
                            return { ...row, 추경: String(-balance), _note: '불용 방지 잔액 전액 감액' };
                        }
                        return row;
                    });
                    pushHistory(next);
                    return next;
                });
            };

            const resetSupplement = () => {
                if (!confirm('입력된 모든 추경 금액과 사유를 초기화하시겠습니까?')) return;
                setBudgetData(prev => {
                    const next = prev.map(row => ({ ...row, 추경: '', _note: '' }));
                    pushHistory(next);
                    return next;
                });
            };

            const exportJSON = () => {
                const data = { budgetData, expenseData, exportDate: new Date().toISOString(), version: '2.5' };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `학교회계_데이터백업_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const importJSON = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        if (json.budgetData) setBudgetData(json.budgetData);
                        if (json.expenseData) setExpenseData(json.expenseData);
                        alert('데이터가 성공적으로 복원되었습니다.');
                    } catch (err) { alert('올바르지 않은 백업 파일 형식입니다.'); }
                };
                reader.readAsText(file);
            };

            const processBudgetFile = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    let headerIdx = rows.findIndex(r => r && Array.isArray(r) && r.some(v => String(v).includes('정책사업') || String(v).includes('단위사업') || String(v).includes('세부사업')));
                    if (headerIdx === -1) headerIdx = 0;
                    
                    const json = XLSX.utils.sheet_to_json(ws, { range: headerIdx });
                    const filtered = json.filter(r => {
                        const isTotalRow = Object.values(r).some(v => {
                            const s = String(v || '').replace(/\s/g, '');
                            return /합계|소계|누계|전기계|\[.*계.*\]|\[.*소.*\]/.test(s);
                        });
                        if (isTotalRow) return false;
                        return (r['정책사업'] || r['단위사업'] || r['세부사업'] || r['세부항목']);
                    }).map((r, idx) => {
                        const a = Number(r['예산현액 (A)'] || r['예산현액(A)'] || r['예산현액'] || 0);
                        const b = Number(r['원인행위액 (B)'] || r['원인행위액(B)'] || r['원인행위액'] || 0);
                        const c = Number(r['지출액 (C)'] || r['지출액(C)'] || r['지출액'] || 0);
                        return {
                            ...r, _id: `b_${idx}_${Date.now()}`,
                            _a: a, _b: b, _ab: a - b, _c: c, _ac: a - c,
                            _rate: a > 0 ? ((a - b) / a * 100).toFixed(1) : '0.0',
                            _exclude: Number(r['정산재원'] || r['결산제외'] || 0),
                            _costItem: r['원가통계비목'] || r['원가비목'] || r['원가통계'] || '',
                            추경: r['추경'] ? String(r['추경']) : '',
                            _note: r['비고'] || r['추경사유'] || '',
                            _totalType: ''
                        };
                    });
                    setBudgetData(filtered);
                    pushHistory(filtered);
                    setActiveTab('detail');
                };
                reader.readAsBinaryString(file);
            };

            const processExpenseFile = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    let headerIdx = rows.findIndex(r => 
                        r && Array.isArray(r) && r.some(v => String(v).includes('지출일자') || String(v).includes('세부사업명') || String(v).includes('채주'))
                    );
                    if (headerIdx === -1) headerIdx = 0;
                    const json = XLSX.utils.sheet_to_json(ws, { range: headerIdx });
                    const filteredJson = json.filter(r => {
                        const isTotal = Object.values(r).some(v => {
                            const s = String(v || '').replace(/\s/g, '');
                            return /합계|소계|누계|전기계|기간계|월계|\[.*계.*\]/.test(s);
                        });
                        if (isTotal) return false;
                        const amt = Number(r['지출액'] || r['지급액'] || r['금액'] || r['지출액(C)'] || 0);
                        return amt !== 0;
                    });
                    setExpenseData(filteredJson.map((r, idx) => ({
                        ...r,
                        _id: `e_${idx}_${Date.now()}`,
                        _amt: Number(r['지출액'] || r['지급액'] || r['금액'] || r['지출액(C)'] || 0),
                        _date: formatDate(r['지출일자'] || r['일자'] || r['지출일'])
                    })));
                    setActiveTab('expense');
                };
                reader.readAsBinaryString(file);
            };

            // KPI Stats
            const stats = useMemo(() => {
                const raw = budgetData.filter(d => !d._totalType);
                if (!raw.length) return { totalA: 0, totalB: 0, totalC: 0, totalAB: 0, totalSupp: 0, execRate: 0, disbRate: 0, riskCount: 0, totalCount: 0 };
                const totalA = raw.reduce((s, r) => s + (r._a || 0), 0);
                const totalB = raw.reduce((s, r) => s + (r._b || 0), 0);
                const totalC = raw.reduce((s, r) => s + (r._c || 0), 0);
                const totalSupp = raw.reduce((s, r) => s + (Number(r['추경']) || 0), 0);
                const execRate = totalA > 0 ? (totalB / totalA * 100) : 0;
                const disbRate = totalB > 0 ? (totalC / totalB * 100) : 0;

                const projectMap = {};
                raw.forEach(r => {
                    const proj = r['세부사업'] || '기타';
                    if (!projectMap[proj]) projectMap[proj] = { a: 0, b: 0 };
                    projectMap[proj].a += (r._a || 0);
                    projectMap[proj].b += (r._b || 0);
                });
                const projectNames = Object.keys(projectMap);
                const riskCount = projectNames.filter(p => {
                    const item = projectMap[p];
                    return item.a > 0 && ((item.b / item.a) * 100 < 70);
                }).length;

                return { totalA, totalB, totalC, totalAB: totalA - totalB, totalSupp, execRate, disbRate, riskCount, totalCount: projectNames.length };
            }, [budgetData]);

            const detailCols = useMemo(() => [
                { label: '정책사업', key: '정책사업', wk: 'policy' },
                { label: '단위사업', key: '단위사업', wk: 'unit' },
                { label: '세부사업', key: '세부사업', wk: 'project' },
                { label: '세부항목', key: '세부항목', wk: 'item' },
                { label: '산출내역', key: '산출내역', wk: 'desc' },
                { label: '원가통계비목', key: '_costItem', wk: 'cost' },
                { label: '예산현액 (A)', key: '_a', wk: 'a', isNum: true },
                { label: '원인행위액 (B)', key: '_b', wk: 'b', isNum: true },
                { label: '원인행위잔액 (A-B)', key: '_ab', wk: 'ab', isNum: true },
                { label: '지출액 (C)', key: '_c', wk: 'c', isNum: true },
                { label: '지출잔액 (A-C)', key: '_ac', wk: 'ac', isNum: true },
                { label: '추경', key: '추경', wk: 'supplement', isNum: true },
                { label: '추경 사유(비고)', key: '_note', wk: 'note' },
                { label: '불용율', key: '_rate', wk: 'rate', isRate: true },
                { label: '정산재원', key: '_exclude', wk: 'exclude', isNum: true },
                { label: '세부항목담당자', key: '세부항목담당자', wk: 'manager' }
            ], []);

            const expenseCols = useMemo(() => [
                { label: '세부사업명', key: '세부사업명', wk: 'proj' },
                { label: '세부항목명', key: '세부항목명', wk: 'item' },
                { label: '원가비목', key: '원가비목', wk: 'category' },
                { label: '지출일자', key: '_date', wk: 'date' },
                { label: '제목', key: '제목', wk: 'title' },
                { label: '채주', key: '채주', wk: 'payee' },
                { label: '지출액', key: '_amt', wk: 'amount', isNum: true }
            ], []);

            const activeCols = useMemo(() => {
                const cols = activeTab === 'expense' ? expenseCols : detailCols;
                const tabHidden = hiddenCols[activeTab] || {};
                return cols.filter(c => !tabHidden[c.wk]);
            }, [activeTab, hiddenCols, detailCols, expenseCols]);

            const handleSearchChange = (e) => {
                const val = e.target.value;
                setSearch(val);
                startTransition(() => setDeferredSearch(val));
            };

            const handleSort = (colKey) => {
                setSortConfig(prev => ({ key: colKey, direction: prev.key === colKey && prev.direction === 'asc' ? 'desc' : 'asc' }));
            };

            const filteredData = useMemo(() => {
                const source = activeTab === 'expense' ? expenseData : budgetData;
                let items = source.filter(d => {
                    const match = !deferredSearch || Object.values(d).some(v => String(v).toLowerCase().includes(deferredSearch.toLowerCase()));
                    if (!match) return false;
                    for (let colKey in columnFilters) {
                        const allowed = columnFilters[colKey];
                        if (allowed && allowed.length > 0) {
                            let val = (d[colKey] === undefined || d[colKey] === null) ? '' : String(d[colKey]);
                            if (colKey === '_date' && dateMode === 'month') val = val.substring(0, 7);
                            if (!allowed.includes(val)) return false;
                        }
                    }
                    return true;
                });
                if (sortConfig.key) {
                    items.sort((a, b) => {
                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];
                        if (typeof aVal === 'number' && typeof bVal === 'number') return sortConfig.direction === 'asc' ? aVal - bVal : bVal - aVal;
                        aVal = String(aVal || ''); bVal = String(bVal || '');
                        return sortConfig.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    });
                }
                return items;
            }, [activeTab, budgetData, expenseData, deferredSearch, sortConfig, columnFilters, dateMode]);

            const displayData = useMemo(() => {
                if ((activeTab !== 'detail' && activeTab !== 'supplement') || filteredData.length === 0) return filteredData;
                const result = [];
                let currentGroup = filteredData[0]['세부사업'];
                let groupRows = [];
                const addTotalRow = (name, rows) => {
                    if (rows.length === 0) return;
                    const sumA = rows.reduce((s, r) => s + (r._a || 0), 0);
                    const sumB = rows.reduce((s, r) => s + (r._b || 0), 0);
                    const sumC = rows.reduce((s, r) => s + (r._c || 0), 0);
                    const sumExclude = rows.reduce((s, r) => s + (Number(r._exclude) || 0), 0);
                    const sumSupp = rows.reduce((s, r) => s + (Number(r['추경']) || 0), 0);
                    result.push({
                        _id: `subtotal_${name}_${Math.random()}`,
                        '세부사업': `${name} 소계`,
                        _a: sumA, _b: sumB, _ab: sumA - sumB, _c: sumC, _ac: sumA - sumC,
                        추경: sumSupp, _exclude: sumExclude,
                        _rate: sumA > 0 ? ((sumA - sumB) / sumA * 100).toFixed(1) : '0.0',
                        _totalType: 'detail'
                    });
                };
                filteredData.forEach(row => {
                    if (row['세부사업'] !== currentGroup) {
                        addTotalRow(currentGroup, groupRows);
                        currentGroup = row['세부사업'];
                        groupRows = [];
                    }
                    result.push(row);
                    groupRows.push(row);
                });
                addTotalRow(currentGroup, groupRows);
                return result;
            }, [filteredData, activeTab]);

            const totals = useMemo(() => {
                if (activeTab === 'expense') return { expense: filteredData.reduce((acc, cur) => acc + (cur._amt || 0), 0) };
                const baseData = filteredData.filter(d => !d._totalType);
                return {
                    a: baseData.reduce((acc, cur) => acc + (cur._a || 0), 0),
                    b: baseData.reduce((acc, cur) => acc + (cur._b || 0), 0),
                    ab: baseData.reduce((acc, cur) => acc + (cur._ab || 0), 0),
                    c: baseData.reduce((acc, cur) => acc + (cur._c || 0), 0),
                    ac: baseData.reduce((acc, cur) => acc + (cur._ac || 0), 0),
                    supp: baseData.reduce((acc, cur) => acc + (Number(cur['추경']) || 0), 0),
                    exclude: baseData.reduce((acc, cur) => acc + (Number(cur._exclude) || 0), 0)
                };
            }, [filteredData, activeTab]);

            const exportExcel = () => {
                if (activeTab === 'expense') {
                    if (!expenseData.length) return alert('저장할 데이터가 없습니다.');
                    const rows = filteredData.map(r => {
                        const obj = {};
                        activeCols.forEach(col => { obj[col.label] = col.isNum ? (Number(r[col.key]) || 0) : r[col.key]; });
                        return obj;
                    });
                    const ws = XLSX.utils.json_to_sheet(rows);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "세부지출현황");
                    XLSX.writeFile(wb, `학교회계_세부지출_${new Date().toISOString().slice(0,10)}.xlsx`);
                } else {
                    if (!budgetData.length) return alert('저장할 데이터가 없습니다.');
                    const rows = displayData.filter(r => !r._totalType).map(r => {
                        const obj = {};
                        activeCols.forEach(col => { obj[col.label] = col.isNum ? (Number(r[col.key]) || 0) : r[col.key]; });
                        return obj;
                    });
                    const ws = XLSX.utils.json_to_sheet(rows);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "추경현황");
                    XLSX.writeFile(wb, `학교회계_추경현황_${new Date().toISOString().slice(0,10)}.xlsx`);
                }
            };

            const startResize = (e, colKey, isExpense) => {
                e.stopPropagation();
                const startX = e.pageX;
                const startWidth = isExpense ? expenseColWidths[colKey] : detailColWidths[colKey];
                const onMouseMove = (moveE) => {
                    const newWidth = Math.max(50, startWidth + (moveE.pageX - startX));
                    if (isExpense) setExpenseColWidths(p => ({ ...p, [colKey]: newWidth }));
                    else setDetailColWidths(p => ({ ...p, [colKey]: newWidth }));
                };
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            return (
                <div className="container">
                    {/* 1. Header */}
                    <header className="app-header animate-fade-in">
                        <div className="header-left">
                            <div className="logo-title-group">
                                <h1>2026 학교회계 통합 대시보드</h1>
                                <span className="badge-system">v2.5 Pro</span>
                            </div>
                        </div>
                        <div className="header-right">
                            <button className="header-btn" onClick={exportJSON} title="데이터 백업">
                                <IconDownload /> <span>데이터 백업</span>
                            </button>
                            <label className="header-btn" title="데이터 복원" style={{ cursor: 'pointer' }}>
                                <IconUpload /> <span>데이터 복원</span>
                                <input type="file" accept=".json" style={{ display: 'none' }} onChange={importJSON} />
                            </label>
                            <button className="theme-toggle-btn" onClick={() => setIsLightMode(!isLightMode)}>
                                {isLightMode ? <IconMoon /> : <IconSun />} <span>{isLightMode ? '다크' : '라이트'}</span>
                            </button>
                        </div>
                    </header>

                    {/* 2. 4 KPI Summary Cards */}
                    {(budgetData.length > 0 || expenseData.length > 0) && (
                        <div className="kpi-grid animate-fade-in">
                            <div className="kpi-card">
                                <div className="kpi-icon-wrap primary"><IconDollar /></div>
                                <div className="kpi-info">
                                    <span className="kpi-label">총 예산현액 (A)</span>
                                    <div className="kpi-value">₩ {formatCurrency(stats.totalA)}</div>
                                    <div className="kpi-sub">
                                        {stats.totalSupp !== 0 ? (
                                            <span className={`kpi-badge ${stats.totalSupp > 0 ? 'positive' : 'negative'}`}>
                                                추경 후 ₩ {formatCurrency(stats.totalA + stats.totalSupp)}
                                            </span>
                                        ) : (
                                            <span className="kpi-badge neutral">총 {stats.totalCount}개 세부사업</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-icon-wrap success"><IconTrending /></div>
                                <div className="kpi-info">
                                    <div className="kpi-label-row">
                                        <span className="kpi-label">원인행위액 (B)</span>
                                        <span className="kpi-rate-badge">{stats.execRate.toFixed(1)}% 집행</span>
                                    </div>
                                    <div className="kpi-value">₩ {formatCurrency(stats.totalB)}</div>
                                    <div className="kpi-progress-bar">
                                        <div className="kpi-progress-fill" style={{ width: `${Math.min(100, Math.max(0, stats.execRate))}%` }} />
                                    </div>
                                </div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-icon-wrap info"><IconCheckCircle /></div>
                                <div className="kpi-info">
                                    <div className="kpi-label-row">
                                        <span className="kpi-label">실제 지출액 (C)</span>
                                        <span className="kpi-rate-badge neutral">원인대비 {stats.disbRate.toFixed(1)}%</span>
                                    </div>
                                    <div className="kpi-value">₩ {formatCurrency(stats.totalC)}</div>
                                    <div className="kpi-sub">출납완료율: {stats.totalA > 0 ? ((stats.totalC / stats.totalA) * 100).toFixed(1) : 0}%</div>
                                </div>
                            </div>
                            <div className="kpi-card">
                                <div className={`kpi-icon-wrap ${stats.riskCount > 0 ? 'warning' : 'neutral'}`}><IconAlert /></div>
                                <div className="kpi-info">
                                    <span className="kpi-label">원인행위잔액 (A-B)</span>
                                    <div className={`kpi-value ${stats.totalAB < 0 ? 'danger-val' : ''}`}>₩ {formatCurrency(stats.totalAB)}</div>
                                    <div className="kpi-sub">
                                        {stats.riskCount > 0 ? (
                                            <span className="kpi-badge warning">불용주의(70%미만) {stats.riskCount}개</span>
                                        ) : (
                                            <span className="kpi-badge success">전 사업 정상 집행 중</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 3. Upload & Toolbar */}
                    <div className="upload-section animate-fade-in">
                        <div 
                            className={`upload-box ${budgetData.length ? 'done' : ''} ${dragOverBox === 'budget' ? 'drag-active' : ''}`}
                            onClick={() => document.getElementById('budget-file').click()}
                            onDragOver={(e) => { e.preventDefault(); setDragOverBox('budget'); }}
                            onDragLeave={() => setDragOverBox(null)}
                            onDrop={(e) => { e.preventDefault(); setDragOverBox(null); if (e.dataTransfer.files[0]) processBudgetFile(e.dataTransfer.files[0]); }}
                        >
                            <div className="upload-guide">
                                <strong>📂 사업관리카드(현액)</strong>
                                <span className="box-sub-guide">K-에듀파인: 학교회계 &gt; 사업관리 &gt; 사업관리카드(현액) (정책,단위 체크 후 엑셀저장)</span>
                            </div>
                            <div className="box-status">
                                {budgetData.length > 0 ? (
                                    <span className="status-badge done">✅ {budgetData.filter(d => !d._totalType).length}개 항목 완료</span>
                                ) : (
                                    <span className="status-badge ready">클릭 또는 파일 드래그</span>
                                )}
                            </div>
                            <input type="file" id="budget-file" hidden onChange={e => processBudgetFile(e.target.files[0])} accept=".xlsx, .xls" />
                        </div>

                        <div 
                            className={`upload-box ${expenseData.length ? 'done' : ''} ${dragOverBox === 'expense' ? 'drag-active' : ''}`}
                            onClick={() => document.getElementById('expense-file').click()}
                            onDragOver={(e) => { e.preventDefault(); setDragOverBox('expense'); }}
                            onDragLeave={() => setDragOverBox(null)}
                            onDrop={(e) => { e.preventDefault(); setDragOverBox(null); if (e.dataTransfer.files[0]) processExpenseFile(e.dataTransfer.files[0]); }}
                        >
                            <div className="upload-guide">
                                <strong>📂 현금출납부</strong>
                                <span className="box-sub-guide">K-에듀파인: 학교회계 &gt; 지출관리 &gt; 지출장부 &gt; 현금출납부 (전체선택 후 엑셀저장)</span>
                            </div>
                            <div className="box-status">
                                {expenseData.length > 0 ? (
                                    <span className="status-badge done">✅ {expenseData.length}개 지출건 완료</span>
                                ) : (
                                    <span className="status-badge ready">클릭 또는 파일 드래그</span>
                                )}
                            </div>
                            <input type="file" id="expense-file" hidden onChange={e => processExpenseFile(e.target.files[0])} accept=".xlsx, .xls" />
                        </div>

                        <div className="header-tools">
                            <div className="search-box-wrap">
                                <span className="search-icon"><IconSearch /></span>
                                <input type="text" className="search-input" placeholder="사업명, 항목, 비목 검색..." value={search} onChange={handleSearchChange} />
                            </div>
                            <div className="tool-row buttons">
                                <button className="tool-btn manager-toggle" onClick={() => setShowManager(!showManager)}>
                                    <IconSettings /> <span>컬럼 설정</span>
                                </button>
                                <button className={`tool-btn export-btn ${activeTab === 'supplement' ? 'active' : ''}`} onClick={exportExcel}>
                                    <IconSave /> <span>엑셀 저장</span>
                                </button>
                                <button className="tool-btn print-btn" onClick={() => window.print()}>
                                    <IconPrinter /> <span>인쇄</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 4. Tab Navigation */}
                    <div className="tab-area animate-fade-in">
                        <div className="tabs">
                            {[
                                { id: 'detail', label: '1. 세부사업 현황' },
                                { id: 'supplement', label: '2. 추경 시뮬레이터' },
                                { id: 'expense', label: '3. 세부지출현황' }
                            ].map(t => (
                                <div key={t.id} className={`tab ${activeTab === t.id ? 'active' : ''}`} onClick={() => { setActiveTab(t.id); setColumnFilters({}); }}>
                                    {t.label}
                                </div>
                            ))}
                        </div>
                        <div className="tab-status-count">
                            조회: <strong>{filteredData.filter(d => !d._totalType).length}</strong> 건
                        </div>
                    </div>

                    {/* 5. Supplement Toolbar */}
                    {activeTab === 'supplement' && (
                        <div className="supplement-toolbar animate-fade-in">
                            <div className="toolbar-left">
                                <span className="toolbar-title">⚡ 빠른 추경 도구</span>
                                <button className="supp-tool-btn" onClick={reduceAllBalance} title="원인행위잔액 전액 감액">
                                    <span className="icon-neg"><IconMinusCircle /></span> <span>원인행위잔액 전액 감액</span>
                                </button>
                                <button className="supp-tool-btn" onClick={resetSupplement} title="추경 초기화">
                                    <IconRotateCcw /> <span>추경 초기화</span>
                                </button>
                            </div>
                            <div className="toolbar-right">
                                <button className="supp-history-btn" onClick={() => {
                                    if (historyIndex > 0) {
                                        setBudgetData(JSON.parse(JSON.stringify(history[historyIndex - 1])));
                                        setHistoryIndex(historyIndex - 1);
                                    }
                                }} disabled={historyIndex <= 0} title="되돌리기 (Ctrl+Z)">
                                    <IconUndo /> <span>되돌리기</span>
                                </button>
                                <button className="supp-history-btn" onClick={() => {
                                    if (historyIndex < history.length - 1) {
                                        setBudgetData(JSON.parse(JSON.stringify(history[historyIndex + 1])));
                                        setHistoryIndex(historyIndex + 1);
                                    }
                                }} disabled={historyIndex >= history.length - 1} title="다시실행 (Ctrl+Y)">
                                    <IconRedo /> <span>다시실행</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 6. Content Table */}
                    <div className="content-card animate-fade-in">
                        <div className="table-wrapper">
                            <table>
                                <thead className="excel-header">
                                    <tr>
                                        {activeCols.map(col => (
                                            <th 
                                                key={col.key} 
                                                style={{ width: (activeTab === 'expense' ? expenseColWidths[col.wk] : detailColWidths[col.wk]) + 'px' }} 
                                                onClick={() => handleSort(col.key)}
                                            >
                                                <div className="header-content">
                                                    <span className={`filter-btn ${columnFilters[col.key]?.length > 0 ? 'active' : ''}`} onClick={(e) => { e.stopPropagation(); setActiveFilterCol(activeFilterCol === col.key ? null : col.key); }}>
                                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                                                    </span>
                                                    <span className="header-label">{col.label}</span>
                                                    <span style={{ opacity: 0.4, fontSize: '9px' }}>{sortConfig.key === col.key ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '▼'}</span>
                                                </div>
                                                <div className="resizer" onMouseDown={e => startResize(e, col.wk, activeTab === 'expense')} />
                                                
                                                {/* Filter Popover */}
                                                {activeFilterCol === col.key && (
                                                    <div className="filter-menu" ref={filterRef} onClick={e => e.stopPropagation()}>
                                                        {col.key === '_date' && (
                                                            <div className="date-mode-toggle">
                                                                <button className={dateMode === 'month' ? 'active' : ''} onClick={() => { setDateMode('month'); setColumnFilters(p => ({ ...p, [col.key]: [] })); }}>월별</button>
                                                                <button className={dateMode === 'day' ? 'active' : ''} onClick={() => { setDateMode('day'); setColumnFilters(p => ({ ...p, [col.key]: [] })); }}>일별</button>
                                                            </div>
                                                        )}
                                                        {(() => {
                                                            const src = activeTab === 'expense' ? expenseData : budgetData;
                                                            let vals = [...new Set(src.filter(d => !d._totalType).map(d => {
                                                                let v = (d[col.key] === undefined || d[col.key] === null) ? '' : String(d[col.key]);
                                                                if (col.key === '_date' && dateMode === 'month') v = v.substring(0, 7);
                                                                return v;
                                                            }))].sort();
                                                            const selected = columnFilters[col.key] || [];
                                                            return (
                                                                <>
                                                                    <div className="filter-item header-item" onClick={() => setColumnFilters(p => ({ ...p, [col.key]: selected.length === vals.length ? [] : vals }))}>
                                                                        <input type="checkbox" checked={selected.length === vals.length} readOnly />
                                                                        <strong>(전체 선택)</strong>
                                                                    </div>
                                                                    <hr className="filter-divider" />
                                                                    <div className="filter-scroll-list">
                                                                        {vals.map(v => (
                                                                            <div key={v} className="filter-item" onClick={() => setColumnFilters(p => ({
                                                                                ...p,
                                                                                [col.key]: p[col.key]?.includes(v) ? p[col.key].filter(x => x !== v) : [...(p[col.key] || []), v]
                                                                            }))}>
                                                                                <input type="checkbox" checked={selected.includes(v)} readOnly />
                                                                                <span>{v === '' ? '(공백)' : v}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </>
                                                            );
                                                        })()}
                                                    </div>
                                                )}
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {displayData.map((r, i) => (
                                        <TableRow 
                                            key={r._id || i} 
                                            row={r} 
                                            activeCols={activeCols} 
                                            activeTab={activeTab} 
                                            onUpdateBudget={updateBudgetValue} 
                                        />
                                    ))}

                                    {/* Grand Total Row */}
                                    <tr className="grand-total">
                                        {activeTab === 'expense' ? (
                                            (() => {
                                                const amtIdx = activeCols.findIndex(c => c.wk === 'amount');
                                                const labelSpan = amtIdx > 0 ? amtIdx : 1;
                                                const afterAmtCols = activeCols.slice(amtIdx);
                                                return (
                                                    <>
                                                        <td colSpan={labelSpan} className="center-cell">총 합 계</td>
                                                        {afterAmtCols.map(col => (
                                                            <td key={col.key} className={col.key === '_amt' ? 'num-cell' : 'center-cell'}>
                                                                {col.key === '_amt' ? formatCurrency(totals.expense) : ''}
                                                            </td>
                                                        ))}
                                                    </>
                                                );
                                            })()
                                        ) : (
                                            (() => {
                                                const firstNumIdx = activeCols.findIndex(c => c.isNum || c.isRate);
                                                const labelSpan = firstNumIdx > 0 ? firstNumIdx : 1;
                                                const afterNumCols = activeCols.slice(firstNumIdx);
                                                return (
                                                    <>
                                                        <td colSpan={labelSpan} className="center-cell">총 합 계</td>
                                                        {afterNumCols.map(col => {
                                                            let val = '';
                                                            let className = col.isNum ? 'num-cell' : col.isRate ? 'percent-cell' : 'center-cell';
                                                            if (col.key === '_a') val = formatCurrency(totals.a);
                                                            else if (col.key === '_b') val = formatCurrency(totals.b);
                                                            else if (col.key === '_ab') val = formatCurrency(totals.ab);
                                                            else if (col.key === '_c') val = formatCurrency(totals.c);
                                                            else if (col.key === '_ac') val = formatCurrency(totals.ac);
                                                            else if (col.key === '추경') val = formatCurrency(totals.supp);
                                                            else if (col.key === '_exclude') val = formatCurrency(totals.exclude);
                                                            else if (col.key === '_rate') val = totals.a > 0 ? ((totals.a - totals.b) / totals.a * 100).toFixed(1) + '%' : '0.0%';
                                                            else if (col.key === '_note') val = totals.supp !== 0 ? `순증감: ₩ ${formatCurrency(totals.supp)}` : '';
                                                            
                                                            const isNeg = (col.key === '_a' && totals.a < 0) || (col.key === '_b' && totals.b < 0) || 
                                                                          (col.key === '_ab' && totals.ab < 0) || (col.key === '_c' && totals.c < 0) || 
                                                                          (col.key === '_ac' && totals.ac < 0) || (col.key === '_rate' && totals.a > 0 && (totals.a - totals.b) < 0);
                                                            
                                                            return <td key={col.key} className={`${className} ${isNeg ? 'negative-val' : ''}`}>{val}</td>;
                                                        })}
                                                    </>
                                                );
                                            })()
                                        )}
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Column Manager Modal */}
                    {showManager && (
                        <div className="col-manager-backdrop" onClick={() => setShowManager(false)}>
                            <div className="col-manager-modal" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>⚙️ 컬럼 표시/숨김 설정 ({activeTab === 'expense' ? '세부지출' : activeTab === 'supplement' ? '추경' : '세부사업'})</h3>
                                    <button className="close-btn" onClick={() => setShowManager(false)}>✕</button>
                                </div>
                                <div className="modal-body">
                                    <p className="modal-desc">체크된 컬럼만 화면 테이블에 표시됩니다.</p>
                                    <div className="col-grid">
                                        {(activeTab === 'expense' ? expenseCols : detailCols).map(col => (
                                            <label key={col.wk} className={`col-checkbox-label ${!(hiddenCols[activeTab] || {})[col.wk] ? 'checked' : ''}`}>
                                                <input 
                                                    type="checkbox" 
                                                    checked={!(hiddenCols[activeTab] || {})[col.wk]} 
                                                    onChange={() => setHiddenCols(p => ({
                                                        ...p,
                                                        [activeTab]: { ...p[activeTab], [col.wk]: !p[activeTab]?.[col.wk] }
                                                    }))} 
                                                />
                                                <span>{col.label}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn-secondary" onClick={() => {
                                        if (activeTab === 'detail') setHiddenCols(p => ({ ...p, detail: { policy: true, unit: true, manager: true, supplement: true, note: true } }));
                                        else if (activeTab === 'supplement') setHiddenCols(p => ({ ...p, supplement: { policy: true, unit: true, manager: true, rate: true } }));
                                        else setHiddenCols(p => ({ ...p, expense: {} }));
                                    }}>기본값 복원</button>
                                    <button className="btn-primary" onClick={() => setShowManager(false)}>완료</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
